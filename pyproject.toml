[tool.ruff]
line-length = 127
target-version = "py313"
extend-exclude = [".venv", "venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "labs", "media", "docs"]

[tool.ruff.lint]
# BLOQUEANTE: solo correctitud (sintaxis, flujo, imports y nombres).
# B/UP/SIM/RUF quedan como DEUDA ASESORADA no bloqueante:
#   ruff check . --select B,UP,SIM,RUF
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F821"]
# OJO: W503 no es un selector válido en ruff (ruff no implementa W503/W504; la
# intención la cubre flake8 con --extend-ignore=E203,W503 en .pre-commit-config.yaml).
ignore = ["E203"]
per-file-ignores = { "*/tests/*" = ["E501"] }

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false          # módulos sin anotar: no imponer de golpe
exclude = "(^|/)tests/"

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "anyio", "starlette", "httpx", "websockets", "yaml"]
ignore_missing_imports = true
