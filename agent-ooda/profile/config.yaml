# config.yaml — perfil Hermes del ejecutor OODA de vulnerator-ai (OODA DIRECTO a Kali).
# Vive en el home del perfil default de Hermes (/opt/data/config.yaml dentro del contenedor
# ooda-agent; ver docker-compose.yml).
#
# DISENO: Hermes es CLIENTE de dos servidores MCP y ejecuta las tools DIRECTAMENTE: el de la Kali
# (`kali`, tools de pentest CLI) y el del navegador (`playwright`, Chromium headless para la parte
# web). No hay core, API ni UI de por medio: no hay gates (scope/consentimiento/intrusividad/audit).
# Toda la superficie de Hermes son esos dos MCP (cero toolsets nativos), y la responsabilidad del
# alcance recae en el operador (ver ADVERTENCIA del docker-compose.yml).
#
# VERIFICADO contra la doc oficial de Hermes:
#   - mcp_servers (HTTP + tools.include/exclude + prompts/resources):
#     https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/mcp.md
#   - perfiles / config por perfil:
#     https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/profiles.md

# --- Modelo (proveedor LLM = OpenRouter) ------------------------------------
# La key del LLM la lee Hermes de la variable de entorno OPENROUTER_API_KEY (NO HERMES_LLM_API_KEY):
# el compose la inyecta tal cual en el proceso y Hermes la toma de ahi. SIN `hermes setup`
# interactivo y SIN secreto en claro en el repo.
# --- Skin / branding --------------------------------------------------------
# Custom skin for Vulnerator. Activates the cyber-red theme, "Vulnerator"
# agent name, ⚡ prompt symbol, and custom ASCII banner in the TUI and dashboard.
# The skin YAML is served from agent-ooda/profile/skins/vulnerator.yaml and
# copied to /opt/data/skins/ by the docker-compose startup script.
display:
  skin: "vulnerator"

model:
  # mistral-large-4-0: modelo preparado para el encuadre ofensivo del pentest autorizado. Claude
  # (anthropic/claude-sonnet-*) rechaza el encuadre ofensivo (el safety filter de OpenRouter/
  # Anthropic devuelve "violative cyber content" y no responde). Mistral large no rehusa el pentest
  # autorizado, por eso es el modelo del conductor OODA.
  # NOTA: este valor es el DEFAULT de fallback. Se puede sobreescribir en tiempo de arranque con la
  # variable de entorno OPENROUTER_MODEL (ver docker-compose.yml / .env.example): si OPENROUTER_MODEL
  # esta definida y no vacia, el arranque hace `hermes config set model.default <valor>`; si esta
  # vacia o sin definir, se usa este valor tal cual.
  # INFERENCIA LOCAL/REMOTA (opcional): si se define OLLAMA_BASE_URL en el .env, el arranque
  # selecciona un endpoint Ollama (OpenAI-compatible) en tiempo de ejecucion via
  # `hermes config set model.provider custom` + `model.base_url <OLLAMA_BASE_URL>` +
  # `model.default <OLLAMA_MODEL>`, y Hermes usa Ollama en vez de OpenRouter. Si OLLAMA_BASE_URL
  # esta vacia/sin definir, el fallback es OpenRouter + este model.default (sin cambios).
  default: "mistralai/mistral-large-4-0"

# --- Fallback automatico (Hermes native) -------------------------------------
# CADENA DE FALLBACK: si el modelo primario falla (rate-limit 429, server error 500/502/503,
# auth failure 401/403), Hermes cambia AUTOMATICAMENTE al fallback mid-session sin perder
# el contexto de la conversacion. El fallback es PER-TURN: cada mensaje nuevo intenta el
# primario de nuevo; si vuelve a fallar, reactiva el fallback solo para ese turno.
#
# VENTAJAS GLM-5.3 Flash vs Mistral Large 4:
#   - Mismo Cyber Index (50% ambos en Artificial Analysis)
#   - 20x mas barato: $0.07/M in, $0.21/M out (vs $1.36/$4.18)
#   - Probado en produccion real: 0-days en navegador, Hugging Face incident response
#   - Multimodal: acepta imagenes (util para screenshots de targets web)
#   - Context: 1M tokens
#   - Safeguards bypasseables (pero en pentest autorizado es ventaja, no problema)
#   - CyberGym 84.5% (top score), ExploitBench 54.4%, caso real end-to-end exploits
#
# DESVENTAJAS:
#   - NexBench 29/100 (puesto 13): CyberGym no se traduce a pentesting autonomo largo
#   - Menos data publica de refusal rates en contexto corporativo (Mistral mas probado)
#
# ATENCION PROMPT CACHE: cuando el fallback se activa, el nuevo proveedor:modelo NO tiene el
# prefix cacheado de tu conversacion, asi que el siguiente request re-lee toda la historia a
# precio completo de input tokens (no 75-90% descuento de cache). Lo mismo aplica cuando el
# turno termina y se restaura el primario. Es el costo de mantenerse vivo durante un outage.
#
# SINTAXIS: lista `fallback_providers` (no singular `fallback_model`). Cada entrada necesita
# `provider` y `model`. Ver https://hermes-agent.nousresearch.com/docs/user-guide/features/fallback-providers
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3-flash

# --- Primer servidor MCP: la Kali (contenedor `kali`) -----------------------
# Hermes es CLIENTE de este MCP: ejecuta las tools de pentest CLI DIRECTO sobre la Kali. Es la via
# principal al target (el navegador va por el segundo MCP, `playwright`, mas abajo). Sintaxis
# verificada en mcp.md (HTTP servers + Per-server filtering).
#
# NOMBRE DEL SERVER = `kali`. Hermes registra las tools MCP como `mcp_<server>_<tool>`, asi que las
# tools efectivas son `mcp_kali_<tool>` (p. ej. `mcp_kali_kali_run`). El filtro `tools.include` se
# aplica sobre el nombre del tool TAL COMO lo expone el servidor (`kali_run`, `iam_enum`, ...), no
# sobre el nombre efectivo.
mcp_servers:
  kali:
    # Endpoint del servidor kali-mcp (streamable-HTTP sobre `/`, red interna del compose). SIN
    # headers ni token: el servidor kali-mcp no autentica; la seguridad del endpoint es el
    # aislamiento de la red interna de docker.
    url: "http://kali:8900"
    tools:
      # POSTURE (the MCP SERVER is the SOURCE OF TRUTH: "what the server exposes = what
      # Hermes sees"). The `tools.include` that previously did an exact whitelist of the Kali's
      # tools is REMOVED. Deliberate consequences (user's decision):
      #   - The VISIBLE surface goes from 10 tools to the 15 native ones that the server
      #     publishes by introspection (server_info already derives its list from FastMCP's registry).
      #   - Any tool that the server adds LATER (including those contributed by a third-party
      #     plugin) enters Hermes's surface WITHOUT passing through a gate here: there is no
      #     case-by-case review in this file.
      # If one wanted to review tool by tool again, the way is to RE-ADD an `include:` with the
      # exact whitelist of names (as the server exposes them) under this same `tools:` key.
      # It is NOT done now: the source of truth is the server.
      # Desactiva los wrappers de utilidad que Hermes anadiria (list_prompts/get_prompt,
      # list_resources/read_resource). Verificado en mcp.md ("Filter utility tools too").
      prompts: false
      resources: false

  # --- Segundo MCP: el navegador (contenedor `playwright-mcp`) ----------------
  # Da a Hermes un navegador REAL (Chromium headless) para la parte WEB del pentest, por
  # MCP. NO reactiva ningun toolset nativo (browser/web siguen desactivados abajo): la
  # superficie web es `mcp_playwright_*`, no el toolset `browser` de Hermes. Asi la parte
  # web NO queda limitada a `kali_run`: las tools CLI (nmap/whatweb/nuclei/ffuf/sqlmap) van
  # por la Kali y la navegacion/DOM/interaccion van por este MCP. Lo usa la skill
  # `web-pentest`. Endpoint streamable-HTTP en `/mcp` (imagen oficial microsoft/playwright).
  playwright:
    url: "http://playwright-mcp:8931/mcp"
    # SIN tools.include: se exponen las tools del navegador que trae la imagen (navigate,
    # click, type, snapshot, evaluate, ...). El nombre efectivo que vera el modelo es
    # `mcp_playwright_<tool>`. Se filtran los wrappers de utilidad igual que en kali.
    tools:
      prompts: false
      resources: false

# --- Toolsets: SOLO los dos MCP (Kali + navegador) --------------------------
# OBJETIVO: que la superficie de Hermes sean EXCLUSIVAMENTE los dos MCP (`kali` + `playwright`) —
# nada de terminal/code_execution/file/browser/web nativos (ensucian el razonamiento del bucle y
# reintroducen superficie que no queremos). El navegador llega por MCP, NO por el toolset `browser`.
#
# `toolsets:` es una LISTA de bundles (toolsets-reference.md), NO `toolsets.enabled` (esa llave no
# existe y Hermes la ignora -> caeria al platform toolset por defecto `hermes-api-server`, que trae
# file/terminal/web/browser/code_execution...). Cada servidor MCP genera un toolset dinamico
# `mcp-<server>` (aqui `mcp-kali` y `mcp-playwright`), referenciable por el nombre del server. Al
# listar SOLO estos dos, la unica superficie son las tools de ambos MCP (ya filtradas por tools).
toolsets:
  - kali                 # MCP de la Kali (dinamico `mcp-kali`): tools de pentest CLI.
  - playwright           # MCP del navegador (dinamico `mcp-playwright`): web real. CERO tools nativas.
  - todo                 # todo_list: estado vivo del bucle OODA, compresion-resistente (ver SOUL.md).
  - kanban               # kanban_*: durable task board, shared SQLite, multi-profile coordination.

# Defensa en profundidad (agent.disabled_toolsets, toolsets-reference.md): aunque `toolsets: [kali]`
# ya excluye lo demas, se desactivan EXPLICITAMENTE los bundles nativos, por si un default de
# plataforma los reintrodujera. Deben desaparecer del razonamiento del conductor OODA.
#
# EXCEPCION: `delegation` SI esta habilitado (NO esta en esta lista). El conductor OODA necesita
# `delegate_task` para la HIGIENE DE CONTEXTO: puede delegar una rama de exploracion larga y acotada
# (p. ej. "enumera todo este /24 y resume") a un SUBAGENTE con contexto FRESCO, que hereda los
# toolsets del padre (`kali`+`playwright` -> `mcp_kali_*`/`mcp_playwright_*`) y SOLO devuelve su
# resumen final al conductor. Asi el
# contexto del bucle OODA no se infla con la salida cruda de ramas largas. Ver skill `pentest-ooda`
# (seccion de delegacion). Verificado: delegation.md (delegate_task = contexto aislado + toolset
# heredado + solo el resumen vuelve al padre).
agent:
  disabled_toolsets:
    - code_execution
    - terminal
    - file
    - browser
    - web
    - search
    - computer_use
    - memory
    - skills

# Progressive tool disclosure (Tool Search bridge): por defecto Hermes DIFIERE las tools MCP y
# expone unos tools-puente (`tool_describe`/`tool_search`) para cargar su esquema bajo demanda, lo
# que ensucia el log. Con pocas tools MCP no hace falta: lo DESACTIVAMOS para que Hermes vea las
# tools de la Kali directamente (toolsets-reference.md / tool-search.md).
tools:
  tool_search:
    enabled: false

# --- Backend de terminal ----------------------------------------------------
# Hermes NO usa terminal nativa (el toolset `terminal` esta desactivado arriba): ejecuta en la Kali
# a traves del MCP (kali_run). Se deja `local` por si la imagen lo exige al arrancar. OJO: `local`
# NO es sandbox (profiles.md).
terminal:
  backend: "local"

# --- Delegación: concurrencia elevada para pentests de red grandes ----------
# El conductor OODA usa delegate_task para HIGIENE DE CONTEXTO (ver arriba). Por defecto Hermes
# limita a 10 tareas concurrentes; para pentests de redes grandes (/24, 254 hosts) se sube a 50
# (validado en el refactor de 1,393 agentes de Nous: 218 workers concurrentes sin problemas).
delegation:
  max_concurrent_children: 50

# --- Memoria / aprendizaje --------------------------------------------------
# Efimero por engagement: el perfil default se recrea en cada arranque copiando esta plantilla
# declarativa (ver docker-compose.yml command), asi la memoria/skills aprendidas no se heredan entre
# engagements aunque el volumen con nombre persista fisicamente.

# --- Plataforma API server --------------------------------------------------
# El API server OpenAI-compatible de Hermes (/v1/runs, /v1/runs/{id}/events, /health) permite
# disparar y observar a Hermes por HTTP. VERIFICADO contra la imagen: hay que DECLARAR la plataforma
# aqui (platforms.api_server) para que el gateway la arranque; no basta con las env vars. La `key`
# NO se versiona: la inyecta el arranque (docker-compose command) desde HERMES_API_SERVER_KEY.
platforms:
  api_server:
    enabled: true
    host: "0.0.0.0"   # alcanzable por la red interna del compose
    port: 8642        # NO publicado al host (sin ports: en el compose); solo red interna

# --- Dashboard web ----------------------------------------------------------
# Hermes' built-in web dashboard. Binds to 0.0.0.0 (port 9119, published to the host via
# docker-compose.yml ports:) only when an auth provider is registered. We use basic_auth so
# the container can be reached from the browser without entering the TUI.
# Credentials: admin / vulnerator (change password and regenerate hash with:
#   docker exec <ooda-agent> python3 -c "from plugins.dashboard_auth.basic import hash_password; print(hash_password('your-password'))"
# then update dashboard.basic_auth.password_hash below).
dashboard:
  host: "0.0.0.0"
  port: 9119
  basic_auth:
    username: "admin"
    # Hash for "vulnerator" — regenerate if you change the password.
    password_hash: "scrypt$16384$8$1$2ZcMvpA3ilGi8e2A3wmOBQ==$IdIdI0Mxd71T2lh7aKc++9/VPPnuGYjgwXIlwNBrVko="
  # ember = crimson/bronze built-in theme — closest to Vulnerator-AI red palette.
  # Other built-in options: cyberpunk (green matrix), midnight, mono, nous-blue, rose.
  theme: "ember"

# --- Mensajeria / cron ------------------------------------------------------
# NO conectar bots de mensajeria ni cron: la mensajeria es un vector de entrada no confiable. Solo
# se declara la plataforma api_server de arriba.
