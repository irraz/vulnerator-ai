name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ============================================================================
  # VERIFICACIÓN RÁPIDA DE PR
  # ============================================================================
  pr-validation:
    name: ✅ Validación de PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Verificar que el título no esté vacío y tenga longitud razonable
          if [ ${#PR_TITLE} -lt 10 ]; then
            echo "❌ El título del PR es demasiado corto (mínimo 10 caracteres)"
            exit 1
          fi
          
          if [ ${#PR_TITLE} -gt 100 ]; then
            echo "⚠️ El título del PR es muy largo (recomendado <100 caracteres)"
          fi
          
          echo "✅ Título del PR válido"

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<'; then
            echo "❌ El PR tiene conflictos de merge"
            exit 1
          fi
          echo "✅ No hay conflictos de merge"

      - name: Check for large files
        run: |
          # Verificar que no se añadan archivos muy grandes (>10MB)
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read file; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo 0)
              if [ $size -gt 10485760 ]; then
                echo "⚠️ Archivo grande detectado: $file ($(numfmt --to=iec $size 2>/dev/null || echo $size bytes))"
              fi
            fi
          done

  # ============================================================================
  # VERIFICACIÓN DE CAMBIOS SENSIBLES
  # ============================================================================
  sensitive-changes:
    name: 🔒 Revisión de Cambios Sensibles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for sensitive file changes
        run: |
          echo "Revisando cambios en archivos sensibles..."
          
          # Lista de patrones de archivos sensibles
          SENSITIVE_PATTERNS=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "*.jks"
            ".env"
            "*secret*"
            "*password*"
            "docker-compose*.yml"
          )
          
          FOUND_SENSITIVE=false
          
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -i "$pattern" || true)
            if [ ! -z "$files" ]; then
              echo "⚠️ Cambios detectados en archivos sensibles que coinciden con: $pattern"
              echo "$files"
              FOUND_SENSITIVE=true
            fi
          done
          
          if [ "$FOUND_SENSITIVE" = true ]; then
            echo ""
            echo "⚠️⚠️⚠️ ATENCIÓN ⚠️⚠️⚠️"
            echo "Se detectaron cambios en archivos potencialmente sensibles."
            echo "Por favor, revisa que no contengan secretos o credenciales."
            echo "Este es un WARNING, no bloquea el PR."
          else
            echo "✅ No se detectaron cambios en archivos sensibles"
          fi

  # ============================================================================
  # VERIFICACIÓN DE DOCKERFILE
  # ============================================================================
  dockerfile-lint:
    name: 🐳 Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/kali/Dockerfile
          failure-threshold: warning

      - name: Lint MCP Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/mcp/Dockerfile
          failure-threshold: warning

  # ============================================================================
  # COMENTARIO AUTOMÁTICO EN PR
  # ============================================================================
  pr-comment:
    name: 💬 Comentario Automático
    runs-on: ubuntu-latest
    needs: [pr-validation, sensitive-changes, dockerfile-lint]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            let status = '✅ Todos los checks pasaron';
            let emoji = '🎉';
            
            const failedJobs = Object.entries(jobs).filter(([_, job]) => job.result === 'failure');
            const warningJobs = Object.entries(jobs).filter(([_, job]) => job.result === 'success');
            
            if (failedJobs.length > 0) {
              status = '❌ Algunos checks fallaron';
              emoji = '⚠️';
            }
            
            const comment = `
            ## ${emoji} Reporte de Quality Checks
            
            **Status**: ${status}
            
            ### Resultados:
            ${Object.entries(jobs).map(([name, job]) => {
              const icon = job.result === 'success' ? '✅' : job.result === 'failure' ? '❌' : '⏭️';
              return `- ${icon} **${name}**: ${job.result}`;
            }).join('\n')}
            
            ---
            *Pipeline de seguridad ejecutada automáticamente*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
