name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ============================================================================
  # QUICK PR VALIDATION
  # ============================================================================
  pr-validation:
    name: ✅ PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check that the title is not empty and has a reasonable length
          if [ ${#PR_TITLE} -lt 10 ]; then
            echo "❌ The PR title is too short (minimum 10 characters)"
            exit 1
          fi
          
          if [ ${#PR_TITLE} -gt 100 ]; then
            echo "⚠️ The PR title is very long (recommended <100 characters)"
          fi
          
          echo "✅ PR title is valid"

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<'; then
            echo "❌ The PR has merge conflicts"
            exit 1
          fi
          echo "✅ No merge conflicts"

      - name: Check for large files
        run: |
          # Check that no very large files (>10MB) are added
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read file; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo 0)
              if [ $size -gt 10485760 ]; then
                echo "⚠️ Large file detected: $file ($(numfmt --to=iec $size 2>/dev/null || echo $size bytes))"
              fi
            fi
          done

  # ============================================================================
  # SENSITIVE CHANGE REVIEW
  # ============================================================================
  sensitive-changes:
    name: 🔒 Sensitive Change Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for sensitive file changes
        run: |
          echo "Reviewing changes in sensitive files..."
          
          # Sensitive file pattern list
          SENSITIVE_PATTERNS=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "*.jks"
            ".env"
            "*secret*"
            "*password*"
            "docker-compose*.yml"
          )
          
          FOUND_SENSITIVE=false
          
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -i "$pattern" || true)
            if [ ! -z "$files" ]; then
              echo "⚠️ Changes detected in sensitive files matching: $pattern"
              echo "$files"
              FOUND_SENSITIVE=true
            fi
          done
          
          if [ "$FOUND_SENSITIVE" = true ]; then
            echo ""
            echo "⚠️⚠️⚠️ ATTENTION ⚠️⚠️⚠️"
            echo "Changes were detected in potentially sensitive files."
            echo "Please verify that they contain no secrets or credentials."
            echo "This is a WARNING; it does not block the PR."
          else
            echo "✅ No changes detected in sensitive files"
          fi

  # ============================================================================
  # DOCKERFILE VALIDATION
  # ============================================================================
  dockerfile-lint:
    name: 🐳 Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/kali/Dockerfile
          failure-threshold: error

      - name: Lint MCP Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/mcp/Dockerfile
          failure-threshold: error

  # ============================================================================
  # AUTOMATIC PR COMMENT
  # ============================================================================
  pr-comment:
    name: 💬 Automatic Comment
    runs-on: ubuntu-latest
    needs: [pr-validation, sensitive-changes, dockerfile-lint]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            let status = '✅ All checks passed';
            let emoji = '🎉';
            
            const failedJobs = Object.entries(jobs).filter(([_, job]) => job.result === 'failure');
            const warningJobs = Object.entries(jobs).filter(([_, job]) => job.result === 'success');
            
            if (failedJobs.length > 0) {
              status = '❌ Some checks failed';
              emoji = '⚠️';
            }
            
            const comment = `
            ## ${emoji} Quality Checks Report
            
            **Status**: ${status}
            
            ### Results:
            ${Object.entries(jobs).map(([name, job]) => {
              const icon = job.result === 'success' ? '✅' : job.result === 'failure' ? '❌' : '⏭️';
              return `- ${icon} **${name}**: ${job.result}`;
            }).join('\n')}
            
            ---
            *Security pipeline run automatically*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
