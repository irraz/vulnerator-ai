name: Security Pipeline

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]
  schedule:
    # Run the full scan weekly (Mondays at 2 AM UTC)
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual runs

jobs:
  # ============================================================================
  # SECRET DETECTION WITH TRUFFLEHOG
  # ============================================================================
  secrets-scan:
    name: 🔐 TruffleHog - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for TruffleHog

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Versioned files only; ignore .env and local files
          extra_args: --only-verified

  # ============================================================================
  # SECURITY ANALYSIS WITH CODEQL (SAST)
  # ============================================================================
  codeql-analysis:
    name: 🔍 CodeQL - Code Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ============================================================================
  # PYTHON LINTING AND FORMATTING
  # ============================================================================
  python-lint:
    name: 🐍 Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint bandit

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings for complexity and line length
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          black --check --diff .
        continue-on-error: true

      - name: Security check with bandit
        run: |
          bandit -r docker/ agent-ooda/ -ll -f json -o bandit-report.json || true
          bandit -r docker/ agent-ooda/ -ll
        continue-on-error: true

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ============================================================================
  # PYTHON DEPENDENCY SCAN
  # ============================================================================
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install safety
        run: pip install safety

      - name: Check Kali dependencies
        run: |
          pip install -r docker/kali/requirements.txt
          safety check --json > safety-kali-report.json || true
          safety check
        continue-on-error: true

      - name: Check MCP dependencies
        run: |
          pip install -r docker/mcp/requirements.txt
          safety check --json > safety-mcp-report.json || true
          safety check
        continue-on-error: true

      - name: Upload safety reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safety-reports
          path: |
            safety-kali-report.json
            safety-mcp-report.json

  # ============================================================================
  # DOCKER CONTAINER SCAN
  # ============================================================================
  docker-scan:
    name: 🐳 Trivy - Docker Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    # Run only on schedule, workflow_dispatch, or PRs (not on direct pushes)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: [kali, mcp]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.image }}-${{ hashFiles(format('docker/{0}/**', matrix.image)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.image }}-
            ${{ runner.os }}-buildx-

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          tags: vulnerator-${{ matrix.image }}:test
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Run Trivy vulnerability scanner on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerator-${{ matrix.image }}:test'
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image }}-results.sarif'
          category: 'trivy-${{ matrix.image }}'

      # Move cache to avoid growing indefinitely
      - name: Update cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  # ============================================================================
  # CONFIGURATION AND SECRET FILE SCAN
  # ============================================================================
  config-scan:
    name: ⚙️ Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect secrets in config files
        run: |
          echo "Checking sensitive configuration files..."
          # Verify that there is no .env file with real secrets
          if [ -f .env ]; then
            echo "⚠️ .env file found - verify that it contains no real secrets"
            grep -i "api_key\|password\|secret\|token" .env || echo "✅ No secret patterns detected"
          fi

      - name: Check Docker secrets
        run: |
          echo "Checking secrets in Dockerfiles..."
          grep -rn "ENV.*\(PASSWORD\|SECRET\|TOKEN\|KEY\)" docker/ || echo "✅ No hardcoded secrets found in Dockerfiles"
