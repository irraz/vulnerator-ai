# Pre-commit hooks to run checks locally before push
# Install: pip install pre-commit && pre-commit install
#
# Usage:
#   - Automatic: runs on every git commit
#   - Manual: pre-commit run --all-files

repos:
  # ============================================================================
  # BASIC QUALITY HOOKS
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Prevent direct commits to main
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']
        
      # Detect large files (>500KB)
      - id: check-added-large-files
        args: ['--maxkb=500']
        
      # Verify files end with a newline
      - id: end-of-file-fixer
        
      # Remove trailing whitespace
      - id: trailing-whitespace
        
      # Verify YAML syntax
      - id: check-yaml
        args: ['--unsafe']  # Allows Docker Compose tags
        additional_dependencies: [ruamel.yaml]
        
      # Verify JSON syntax
      - id: check-json
        
      # Detect merge conflict markers
      - id: check-merge-conflict
        
      # Verify scripts have a shebang
      - id: check-shebang-scripts-are-executable
        
      # Detect private keys
      - id: detect-private-key
        
      # Verify Docker Compose file format
      - id: check-yaml
        files: docker-compose.*\.yml$
        additional_dependencies: [ruamel.yaml]

  # ============================================================================
  # SECURITY - SECRET DETECTION
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
        additional_dependencies: [requests]
        exclude: |
          (?x)^(
            \.env\.example|
            \.pre-commit-config\.yaml|
            package-lock\.json|
            .*\.lock|
            docs/example-findings\.jsonl
          )$

  # ============================================================================
  # PYTHON - FORMATTING AND LINTING
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.13
        
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - '--max-line-length=127'
          - '--extend-ignore=E203,W503'
        exclude: |
          (?x)^(
            .*/__pycache__/.*|
            .*/.venv/.*|
            .*/.pytest_cache/.*
          )$

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ['-ll', '-i']  # Low severity, ignore nosec comments
        files: \.py$
        exclude: |
          (?x)^(
            .*/tests/.*|
            .*/test_.*\.py
          )$

  # ============================================================================
  # DOCKER - LINTING
  # ============================================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--ignore', 'DL3008', '--ignore', 'DL3009']

  # ============================================================================
  # PYTHON - IMPORTS AND TYPE CHECKING
  # ============================================================================
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ['--config=pyproject.toml']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ['--config-file=pyproject.toml']
        files: \.py$
        exclude: (^|/)tests/

  - repo: local
    hooks:
      - id: quick-fix-comments
        name: Blocks quick-fix/shortcut/debt comments
        entry: python3 scripts/check_quick_fix_comments.py
        language: system
        files: \.(py|sh|bash|js|ts|yml|yaml|toml|ini|cfg|conf|dockerfile|mk|make)$
        pass_filenames: true

  # ============================================================================
  # MARKDOWN AND DOCUMENTATION
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
        exclude: |
          (?x)^(
            CHANGELOG\.md|
            .*\.min\.json
          )$
