<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vulnerator · browser-view</title>
<style>
  html,body{height:100%;margin:0}

    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 30%,#161a26 0%,#0a0a0a 65%)}

  <h1>VULNERATOR<b>·AI</b></h1>
