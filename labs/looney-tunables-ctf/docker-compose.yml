# Local CTF lab — LPE challenge (ubuntu-server-01)
#
# The container name and hostname are intentionally neutral: they give no hint
# about the attack vector. The agent must enumerate and discover it.

services:
  ctf-target:
    build:
      context: .
      dockerfile: Dockerfile
    # x86-64 is mandatory: the exploit for the target vulnerability is
    # architecture-dependent. On Apple Silicon it is emulated via QEMU/Rosetta.
    platform: linux/amd64
    image: ctf-lpe-target:lab
    container_name: ubuntu-server-01
    hostname: ubuntu-server-01

    # Shared network with the hermes-pentest stack: Vulnerator and Kali
    # reach the target by hostname (ubuntu-server-01) or IP.
    networks:
      - vulnerator-ai

    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:false   # the PoC needs working setuid binaries
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_CHROOT   # sshd privsep sandbox requires chroot()

    mem_limit: 1g
    pids_limit: 512

    restart: "no"

networks:
  vulnerator-ai:
    external: true
    name: vulnerator-ai_default
